[audio]
enable_overdrive = true

[backdrop]
blur_intensity = 0.68999998457729816
tint_intensity = 0.0

[bar]
order = ["bar"]

[bar.bar]
background_opacity = 0.0
border_width = 0.0
capsule = true
capsule_border = "outline"
capsule_foreground = "secondary"
capsule_opacity = 0.79
capsule_padding = 10.0
capsule_radius = 80
capsule_thickness = 0.95999998226761818
enabled = true
panel_overlap = 12
font_family = "JetBrains Mono"
font_weight = 600
margin_ends = 14
margin_edge = 10
scale = 1.1
shadow = false
end = [
    "bongocat",
    "media",
    "tray",
    "wallpaper",
    "wallhaven",
    "volume",
    "notifications",
    "session",
]
center = ["clock"]
start = ["launcher", "workspaces", "active_window", "group:g1"]
thickness = 36

[[bar.bar.capsule_group]]
accordion = false
accordion_direction = "end"
border = "outline"
enabled = true
fill = "surface_variant"
foreground = "secondary"
id = "g1"
members = ["sysmon", "ram"]
opacity = 0.79
padding = 10.0
radius = 80.0
widget_spacing = 12

[battery.device."/org/freedesktop/UPower/devices/battery_hidpp_battery_0"]
warning_threshold = 30

[brightness]
enable_ddcutil = false

[desktop_widgets]
schema_version = 2
widget_order = ["desktop-widget-0000000000000003"]

[desktop_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[desktop_widgets.widget.desktop-widget-0000000000000003]
box_height = 0.0
box_width = 0.0
cx = 853.0
cy = 533.0
rotation = 0.0
type = "fancy_audio_visualizer"

[desktop_widgets.widget.desktop-widget-0000000000000003.settings]
background = false
visualization_mode = "wave_rings"

[dock]
auto_hide = false
enabled = true
margin_edge = 10
radius = 20
reserve_space = false
show_dots = true
smart_auto_hide = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 300.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 360.0

[hooks]
theme_mode_changed = ["~/.config/noctalia/theme-sync.sh"]
wallpaper_changed = ["~/.config/noctalia/wallpaper-hook.sh"]

[hot_corners.bottom_right]
action = "window_switcher"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = []

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true


[location]
custom_schedule = false

[nightlight]
enabled = false
temperature_day = 6500
temperature_night = 5500

[osd]
background_opacity = 0.84999998100101948
offset_y = 20
position = "bottom_center"
scale = 0.90000000596046448

[osd.kinds]
media = false
nightlight = false

[shell]
font_family = "Noto Sans CJK SC"
polkit_agent = true
settings_show_advanced = true

[shell.greeter_sync]
auto_sync = true
privilege_command = "pkexec"

[shell.panel]
control_center_placement = "floating"
control_center_position = "top_right"
session_placement = "floating"
session_position = "center"
transparency_mode = "soft"
wallpaper_placement = "floating"
wallpaper_position = "center"

[[shell.session.actions]]
action = "lock"
countdown_seconds = 0.0
enabled = true
shortcut = "1"
variant = "default"

[[shell.session.actions]]
action = "logout"
countdown_seconds = 0.0
enabled = true
shortcut = "2"
variant = "default"

[[shell.session.actions]]
action = "lock_and_suspend"
countdown_seconds = 0.0
enabled = true
shortcut = "3"
variant = "default"

[[shell.session.actions]]
action = "reboot"
countdown_seconds = 0.0
enabled = true
shortcut = "4"
variant = "default"

[[shell.session.actions]]
action = "shutdown"
countdown_seconds = 0.0
enabled = true
shortcut = "5"
variant = "destructive"

[[shell.session.actions]]
action = "command"
command = "notify-send 'Noctalia' 'Custom session entry'"
countdown_seconds = 0.0
enabled = false
variant = "default"

[theme]
builtin = "Ayu"
community_palette = "One Dark Two"
mode = "auto"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[theme.templates]
builtin_ids = ["kitty", "qt", "starship"]
community_ids = []

# NyxMellow 动态 fcitx5 皮肤（mellow 形状 + Material You 自动取色）
# 路径中的 /home/user 为占位符，由 nyxniri.deploy 在部署时替换为实际 $HOME
[theme.templates.user.nyxniri_gtk3]
index = 3
input_path = "/home/gangx/.config/noctalia/templates/gtk-3.0.css"
output_path = "/home/gangx/.config/gtk-3.0/gtk.css"

[theme.templates.user.nyxniri_gtk4]
index = 4
input_path = "/home/gangx/.config/noctalia/templates/gtk-4.0.css"
output_path = "/home/gangx/.config/gtk-4.0/gtk.css"

# Noctalia -> Neovim base16 配色（官方模板，跟随主题/壁纸自动重渲染）
[theme.templates.user.nvim_noctalia]
index = 5
input_path = "/home/gangx/.config/noctalia/templates/nvim/matugen-template.lua"
output_path = "$XDG_CONFIG_HOME/nvim/lua/matugen.lua"
post_hook = "bash '/home/gangx/.config/noctalia/templates/nvim/apply.sh'"

# Noctalia -> Emacs（Centaur Emacs 的 noctalia 主题）
[theme.templates.user.emacs_noctalia]
index = 6
input_path = "/home/gangx/.config/noctalia/templates/emacs/emacs.el"
output_path = "/home/gangx/.emacs.d/themes/noctalia-theme.el"
post_hook = "bash '/home/gangx/.config/noctalia/templates/emacs/apply.sh'"

# Noctalia -> Zed（dark/light 双主题）
[theme.templates.user.zed_noctalia]
index = 7
input_path = "/home/gangx/.config/noctalia/templates/zed/zed.json"
output_path = "/home/gangx/.config/zed/themes/noctalia.json"

# Noctalia -> VSCode（本地 extension 主题）
[theme.templates.user.vscode_noctalia]
index = 8
input_path = "/home/gangx/.config/noctalia/templates/vscode/vscode.json"
output_path = "/home/gangx/.vscode/extensions/noctalia.noctaliatheme-0.0.5/themes/NoctaliaTheme-color-theme.json"

[wallpaper]
directory = "/home/gangx/图片/Wallpapers"
fill_mode = "crop"


[plugins]
enabled = ["noctalia/mpvpaper", "noctalia/wallhaven"]

[widget.active_window]
min_length = 0

[widget.clock]
format = "{:%a, %d %b %H:%M}"

[widget.ram]
show_glyph = false
visualization = "none"

[widget.sysmon]
glyph = "cpu"
visualization = "none"

[widget.tray]
detached_panel = true
drawer = true

[widget."ray/echolyrics:echolyrics"]
capsule = false

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[widget.bongocat]
type = "noctalia/bongocat:cat"
input_devices = ["/dev/input/by-path/*-event-kbd"]

[widget.w-engine-widget]
type = "tadomika_ari/w-engine:w-engine-widget"

[widget.mpvpaper]
type = "noctalia/mpvpaper:mpvpaper"

[plugin_settings."noctalia/mpvpaper"]
mpv_options = "--config=no --load-scripts=no --script=~/.config/noctalia/mpv-hook.lua"
picker_placement = "floating"
video_directory = "/home/gangx/图片/Wallpapers/video"

# NyxMellow 动态 fcitx5 皮肤（mellow 形状 + Material You 自动取色）
# 路径中的 /home/user 为占位符，由 nyxniri.deploy 在部署时替换为实际 $HOME
[theme.templates.user.nyxmellow_theme]
index = 0
input_path = "/home/gangx/.local/share/fcitx5/themes/nyxmellow/templates/theme.conf"
output_path = "/home/gangx/.local/share/fcitx5/themes/nyxmellow/theme.conf"

[theme.templates.user.nyxmellow_panel]
index = 1
input_path = "/home/gangx/.local/share/fcitx5/themes/nyxmellow/templates/panel.svg"
output_path = "/home/gangx/.local/share/fcitx5/themes/nyxmellow/panel.svg"

[theme.templates.user.nyxmellow_highlight]
index = 2
input_path = "/home/gangx/.local/share/fcitx5/themes/nyxmellow/templates/highlight.svg"
output_path = "/home/gangx/.local/share/fcitx5/themes/nyxmellow/highlight.svg"
post_hook = "fcitx5-remote --check -r >/dev/null 2>&1 || true; busctl --user call org.fcitx.Fcitx5 /controller org.fcitx.Fcitx.Controller1 ReloadAddonConfig s classicui >/dev/null 2>&1 || true"
